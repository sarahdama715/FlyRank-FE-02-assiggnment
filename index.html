<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Activity Planner - Settings</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Farm Activity Planner</h1>
            <p class="subtitle">Configure your farm settings</p>
        </header>

        <main>
            <form id="settingsForm" class="settings-form" novalidate>
                <!-- Farm Information Section -->
                <fieldset class="form-section">
                    <legend>Farm Information</legend>

                    <div class="form-group">
                        <label for="farmName">Farm Name *</label>
                        <input
                            type="text"
                            id="farmName"
                            name="farmName"
                            placeholder="Enter your farm name"
                            required
                            minlength="2"
                            maxlength="100"
                        >
                        <span class="error-message" id="farmName-error"></span>
                        <span class="help-text">2-100 characters</span>
                    </div>

                    <div class="form-group">
                        <label for="farmType">Farm Type *</label>
                        <select id="farmType" name="farmType" required>
                            <option value="">Select a farm type</option>
                            <option value="crop">Crop Farm</option>
                            <option value="livestock">Livestock</option>
                            <option value="mixed">Mixed Farm</option>
                            <option value="specialty">Specialty/Organic</option>
                        </select>
                        <span class="error-message" id="farmType-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="location">Location/Address *</label>
                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="City, State or coordinates"
                            required
                            minlength="5"
                        >
                        <span class="error-message" id="location-error"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="latitude">Latitude</label>
                            <input
                                type="number"
                                id="latitude"
                                name="latitude"
                                placeholder="-90 to 90"
                                step="0.00001"
                                min="-90"
                                max="90"
                            >
                            <span class="error-message" id="latitude-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="longitude">Longitude</label>
                            <input
                                type="number"
                                id="longitude"
                                name="longitude"
                                placeholder="-180 to 180"
                                step="0.00001"
                                min="-180"
                                max="180"
                            >
                            <span class="error-message" id="longitude-error"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="farmSize">Farm Size (acres)</label>
                        <input
                            type="number"
                            id="farmSize"
                            name="farmSize"
                            placeholder="0"
                            min="0"
                            step="0.1"
                        >
                        <span class="error-message" id="farmSize-error"></span>
                    </div>
                </fieldset>

                <!-- Notification Preferences -->
                <fieldset class="form-section">
                    <legend>Notification Preferences</legend>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="emailNotifications"
                                name="emailNotifications"
                                value="email"
                                checked
                            >
                            <span>Email Notifications</span>
                        </label>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="smsNotifications"
                                name="smsNotifications"
                                value="sms"
                            >
                            <span>SMS Alerts</span>
                        </label>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="weatherAlerts"
                                name="weatherAlerts"
                                value="weather"
                                checked
                            >
                            <span>Weather Alerts</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="notificationFrequency">Notification Frequency *</label>
                        <select id="notificationFrequency" name="notificationFrequency" required>
                            <option value="">Select frequency</option>
                            <option value="realtime">Real-time</option>
                            <option value="daily">Daily Digest</option>
                            <option value="weekly">Weekly Summary</option>
                        </select>
                        <span class="error-message" id="notificationFrequency-error"></span>
                    </div>
                </fieldset>

                <!-- Activity Categories -->
                <fieldset class="form-section">
                    <legend>Activity Categories</legend>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="planting"
                                name="categories"
                                value="planting"
                                checked
                            >
                            <span>Planting</span>
                        </label>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="irrigation"
                                name="categories"
                                value="irrigation"
                                checked
                            >
                            <span>Irrigation</span>
                        </label>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="harvesting"
                                name="categories"
                                value="harvesting"
                            >
                            <span>Harvesting</span>
                        </label>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="maintenance"
                                name="categories"
                                value="maintenance"
                            >
                            <span>Equipment Maintenance</span>
                        </label>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="pestControl"
                                name="categories"
                                value="pest-control"
                            >
                            <span>Pest & Disease Control</span>
                        </label>
                    </div>
                </fieldset>

                <!-- Contact Information -->
                <fieldset class="form-section">
                    <legend>Contact Information</legend>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >
                        <span class="error-message" id="email-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="(555) 123-4567"
                        >
                        <span class="error-message" id="phone-error"></span>
                    </div>
                </fieldset>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Reset</button>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </div>

                <!-- Success Message -->
                <div id="successMessage" class="success-message" role="alert" aria-live="polite">
                    ✓ Settings saved successfully!
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2024 Farm Activity Planner. All rights reserved.</p>
        </footer>
    </div>

    <script src="src/js/form-validation.js"></script>
    <script src="src/js/settings-form.js"></script>
</body>
</html>
